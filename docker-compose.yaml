# Nam's Nuxt Room on the Orange Pi.
#
# The Cloudflare tunnel sends nam-nuxt-room.blackkat.bond to http://localhost:3000, so port 3000 is published on
# the Pi's localhost only (not the LAN). It also joins the external "proxy" network as "nuxt-room", so the shared
# Caddy in /home/nam/prj/caddy can serve it too.
#
#   docker compose up -d --build
services:
    nuxt-room:
        build: .
        image: nuxt-room:latest
        restart: unless-stopped
        ports:
            - "127.0.0.1:3000:3000"
            - "[::1]:3000:3000"
        networks:
            - proxy

networks:
    proxy:
        external: true
